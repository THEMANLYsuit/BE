# THE MANLY 맞춤정장 API 설정
#
# 프로필 구조 (레오네페리토 API 와 같은 규칙)
#   local : 로컬 개발 (docker-compose 의 PostgreSQL) — 기본값. 포트 8081 — 레오네페리토(8080)와 같이 띄운다.
#   prod  : 운영 (모든 접속 정보를 환경변수에서 읽는다. 없으면 기동 실패 = fail closed)
#
# 시크릿은 이 파일에 적지 않는다. .env / 환경변수로만 넣는다.

spring:
  application:
    name: themanly-api

  profiles:
    # 프로필을 지정하지 않으면 local. 운영에서 프로필을 깜빡하면 로컬 DB 를 찾다가 기동이 멈춘다 (fail closed).
    default: local

  autoconfigure:
    exclude:
      # UserDetailsService 빈이 없으면 Boot 가 기본 계정을 만들고 비밀번호를 로그에 찍는다. 쓰지 않는 계정은 만들지 않는다.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  lifecycle:
    timeout-per-shutdown-phase: 20s

  jpa:
    hibernate:
      # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
      ddl-auto: validate
    # 뷰 렌더링 중 지연 로딩을 막는다. 끄지 않으면 N+1 이 조용히 숨는다.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # DB 에는 UTC 로 저장하고, 표시 시점에 한국 시간으로 바꾼다.
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  session:
    # 세션을 DB 에 둔다 (V2 SPRING_SESSION). 스키마는 Flyway 가 만든다.
    store-type: jdbc
    jdbc:
      initialize-schema: never
    # 30분 무활동이면 만료.
    timeout: 30m

  servlet:
    multipart:
      # 가장 큰 업로드 = 메인 필름 영상(V11, FilmService.MAX_BYTES). 사진(원단 · 스타일)은 MediaService 가 10MB 에서 따로 끊는다.
      max-file-size: 60MB
      max-request-size: 62MB

app:
  api:
    # API 의 바깥 주소 — 손님 화면에 주는 절대 주소(필름 사진 /film/…)에 쓴다. 운영은 https://api.(도메인)
    base-url: ${API_BASE_URL:http://localhost:8081}
  film:
    # 메인 스크롤 필름(V11) — 영상에서 사진을 뽑는 도구와 규칙. 운영 이미지에는 ffmpeg 가 들어 있다(Dockerfile)
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    fps: 12
    width: 1280
    max-seconds: 30
  media:
    # 올린 이미지의 공개 기준 주소. 운영은 API 도메인(https://api.../media) — 손님 화면은 다른 도메인이라 절대 주소가 필요하다.
    base-url: ${MEDIA_BASE_URL:/media}
    # 바이트가 저장되는 곳. 운영은 컨테이너 볼륨으로 붙인다(지우면 사진이 사라진다).
    storage-dir: ${MEDIA_STORAGE_DIR:./media-store}
  cors:
    # 쿠키를 주고받으므로 * 를 쓸 수 없다. 허용 출처를 명시한다. 로컬 FE 는 3001.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}
  front:
    # 비밀번호 설정 링크 · 메일 속 링크가 가리키는 손님 화면 주소.
    base-url: ${FRONT_BASE_URL:http://localhost:3001}
  mail:
    # 보내는 사람. SMTP 서버가 이 주소로 보낼 권한이 있어야 한다(SPF/DKIM). TODO(고객확인) 발신 주소
    from: ${MAIL_FROM:THE MANLY <no-reply@themanly.kr>}
  notify:
    # 새 예약 · 취소를 받을 관리자 메일(쉼표로 여럿). 비우면 관리자 메일은 보내지 않는다.
    admin-emails: ${BOOKING_NOTIFY_EMAILS:}
  booking:
    # 상담 · 가봉 예약 규칙 (BookingPolicy). 매장 운영 시간과 휴무일은 더맨리 매장 안내(2026-10-05)에서 왔다.
    # TODO(고객확인) 예약을 받을 시간대 · 한 번에 받을 인원 · 며칠 앞까지 받을지
    open-hour: ${BOOKING_OPEN_HOUR:10}
    close-hour: ${BOOKING_CLOSE_HOUR:20}
    # 한 자리의 길이(분). 상담 60분 · 가봉 60분 · 수령 30분이지만 자리는 이 단위로 자른다.
    slot-minutes: ${BOOKING_SLOT_MINUTES:60}
    # 휴무 요일 (java.time.DayOfWeek 이름, 쉼표). 매장: 화 · 수 휴무.
    closed-days: ${BOOKING_CLOSED_DAYS:TUESDAY,WEDNESDAY}
    # 지금부터 최소 이만큼 뒤부터, 최대 이만큼 앞까지 받는다.
    min-lead-hours: ${BOOKING_MIN_LEAD_HOURS:24}
    max-ahead-days: ${BOOKING_MAX_AHEAD_DAYS:60}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  # 프록시(Caddy) 뒤에 서므로 X-Forwarded-* 를 신뢰한다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 보안 속성(HttpOnly · SameSite · 이름)은 SecurityConfig 가 코드로 못박는다 — 여기 값은 Spring Session 에 전달되지 않는다.
        # Secure 만 여기서 읽는다. local 프로필에서 false 로 내린다.
        secure: true

management:
  health:
    mail:
      # 메일 서버 상태를 헬스체크에 넣지 않는다 — 메일이 잠깐 죽었다고 사이트 전체가 트래픽에서 빠지면 안 된다.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.themanly: INFO

---
# ─────────────────────────────────────────────────────────────
# local — docker-compose 의 PostgreSQL. 이 자격증명은 localhost 전용 개발값이다.
# ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:themanly}
    username: ${DB_USERNAME:themanly}
    password: ${DB_PASSWORD:themanly_local_only}
    driver-class-name: org.postgresql.Driver

  # 로컬 메일은 Mailpit(docker-compose)이 받는다. http://localhost:8026 에 보인다.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}

server:
  servlet:
    session:
      cookie:
        # 로컬은 http 라서 secure 쿠키가 브라우저에 저장되지 않는다. 여기서만 끈다.
        secure: false

logging:
  level:
    com.themanly: DEBUG
    org.hibernate.SQL: DEBUG

---
# ─────────────────────────────────────────────────────────────
# prod — 기본값을 주지 않는다. 환경변수가 비면 기동이 실패해야 한다.
# ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    properties:
      hibernate:
        format_sql: false
