# 로컬 개발용 인프라. 운영 구성이 아니다.
#
#   docker compose up -d      # 시작
#   docker compose down       # 정지 (데이터는 볼륨에 남는다)
#
# 포트가 레오네페리토(5432 · 1025 · 8025)와 겹치지 않게 5433 · 1026 · 8026 을 쓴다 — 둘을 같이 띄운다.
# 여기 적힌 자격증명은 localhost 전용 개발값이다. 운영 값은 .env 로만 넣는다.

services:
  db:
    # 레오네페리토와 같은 태그. Testcontainers 도 같은 태그를 쓴다 — 로컬과 테스트 DB 버전이 갈리면 안 된다.
    image: postgres:18-alpine
    container_name: themanly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-themanly}
      POSTGRES_USER: ${DB_USERNAME:-themanly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-themanly_local_only}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Seoul
    ports:
      # 127.0.0.1 에만 바인딩한다.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 은 /var/lib/postgresql 을 통째로 받는다 (레오네페리토 docker-compose.yml 주석 참고).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-themanly} -d ${DB_NAME:-themanly}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # 로컬 메일 받는 곳. 예약 확정 · 비밀번호 설정 메일이 실제로 나가지 않고 여기 쌓인다. http://localhost:8026
  mail:
    image: axllent/mailpit:v1.27
    container_name: themanly-mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1025"   # SMTP
      - "127.0.0.1:8026:8025"   # 웹 화면

volumes:
  db-data:
    name: themanly-db-data
